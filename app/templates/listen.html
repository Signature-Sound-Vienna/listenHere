<!DOCTYPE html>
  <head>
    <title>Listen Here!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/default.css') }}" />
    <script> 
      let root = "{{ url_for('static', filename='') }}";
      let params = new URL(window.location.toLocaleString()).searchParams;
      let alignmentData = {{ data | tojson }};
      // If alignment was stored in sessionStorage (from /align page), load it
      if (alignmentData === "session") {
        let stored = sessionStorage.getItem("listenHereAlignment");
        if (stored) {
          try {
            window._sessionAlignment = JSON.parse(stored);
            sessionStorage.removeItem("listenHereAlignment");
          } catch(e) { console.error("Failed to parse session alignment:", e); }
        }
      }
      let workId = alignmentData === "local" ? "local" : alignmentData;
      let versionString = {{ version | tojson }};
      let versionDate = {{ version_date | tojson }};
    </script>
    <script src="{{ url_for('static', filename='vendor/fast-json-patch.min.js') }}"></script>
    <script type = "module" src="{{ url_for('static', filename='js/listen.js') }}"></script>
    <script type = "module" src="{{ url_for('static', filename='js/solid.js') }}"></script>
    <script src="{{ url_for('static', filename='js/verovio-toolkit-wasm.js') }}" defer></script>
    <!-- WaveSurfer v7 is imported as an ES module directly in listen.js -->
    <script src="{{ url_for('static', filename='vendor/solid-client-authn.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jsonld.min.js') }}"></script>
  </head>
  <body>
    <!-- Global drop overlay for JSON replacement -->
    <div id="json-drop-overlay">
      <div class="drop-label">Drop alignment JSON to load</div>
    </div>
    <!-- File picker overlay (shown when ?useFiles is active) -->
    <div id="file-picker-overlay" style="display:none;">
      <div id="file-picker-card">
        <h2>Load Files</h2>
        <p class="file-picker-hint">
          Select or drag &amp; drop your alignment JSON and audio files.
          Audio files will be matched to the alignment automatically.
        </p>
        <div id="file-picker-actions">
          <button type="button" id="file-picker-dir-btn" style="display:none;">Choose Folder</button>
          <button type="button" id="file-picker-files-btn">Choose Files</button>
          <input type="file" id="file-picker-input" multiple accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.wma,.json" style="position:absolute;opacity:0;width:0;height:0;overflow:hidden;pointer-events:none;" />
        </div>
        <p class="file-picker-drop-hint">or drag &amp; drop files anywhere on this panel</p>
        <div id="file-picker-json-status"></div>
        <div id="file-picker-status">
          <div id="file-picker-progress"></div>
          <ul id="file-picker-list"></ul>
        </div>
        <button type="button" id="file-picker-continue" style="display:none;">Continue</button>
      </div>
    </div>

    <div id="logo">
      <img src="{{ url_for('static', filename='bat/ListenHereBat.svg') }}" height="140" alt="Logo" />
    </div>
    <div id="wrapper">
      <nav>
          <a id="back">Back</a>
          <button id="mark">Mark</button>
          <button id="playpause">Play/Pause</button>
          <span>
            <input type="checkbox" id="normalize"/>
            <label for="normalize">Normalize audio</label>
          </span>
          <span>
            <input type="checkbox" id="visalign"/>
            <label for="visalign">Visualise alignments</label>
          </span>
          <span>
            <input type="checkbox" id="visrelalign"/>
            <label for="visrelalign">Show relative position</label>
          </span>
          <button id="manage-files-btn" style="display:none;">Manage files</button>
          <button id="download-json-btn" style="display:none;">Download JSON</button>
          <span id="close-listening-badge" style="display:none;">Close Listening</span>
          <div id="audios"></div>
      </nav>
      <div id="content-wrapper">
        <div id="content">
          <div id="waveforms"></div>
        </div>
        <div id="solidPanel">
          <div id="solidTab">
            <div id="solidLogin">
              Please <a id="solidLogin">Click here to log in!</a>
            </div>
          </div>
          <div id="maoExtracts">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
