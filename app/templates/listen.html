<!DOCTYPE html>
  <head>
    <title>Listen Here!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/default.css') }}" />
    <script> 
      let root = "{{ url_for('static', filename='') }}";
      let params = new URL(window.location.toLocaleString()).searchParams;
      let alignmentData = {{ data | tojson }};
      // If alignment was stored in sessionStorage (from /align page), load it
      if (alignmentData === "session") {
        let stored = sessionStorage.getItem("listenHereAlignment");
        if (stored) {
          try {
            window._sessionAlignment = JSON.parse(stored);
            sessionStorage.removeItem("listenHereAlignment");
          } catch(e) { console.error("Failed to parse session alignment:", e); }
        }
      }
      let workId = alignmentData;
      let versionString = {{ version | tojson }};
      let versionDate = {{ version_date | tojson }};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fast-json-patch/3.1.1/fast-json-patch.min.js"></script>
    <script type = "module" src="{{ url_for('static', filename='js/listen.js') }}"></script>
    <script type = "module" src="{{ url_for('static', filename='js/solid.js') }}"></script>
    <script src="{{ url_for('static', filename='js/verovio-toolkit-wasm.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/wavesurfer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wavesurfer.markers.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wavesurfer.spectrogram.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wavesurfer.cursor.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wavesurfer.regions.min.js') }}"></script>
    <script src="{{ url_for('static', filename='npm/node_modules/@inrupt/solid-client-authn-browser/dist/solid-client-authn.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='npm/node_modules/jsonld/dist/jsonld.min.js')}}"></script>
  </head>
  <body>
    <!-- File picker overlay (shown when ?useFiles is active) -->
    <div id="file-picker-overlay" style="display:none;">
      <div id="file-picker-card">
        <h2>Load Audio Files</h2>
        <p class="file-picker-hint">
          The alignment references audio files that must be loaded from your computer.
          Select a folder or individual files to match them.
        </p>
        <div id="file-picker-actions">
          <button id="file-picker-dir-btn" style="display:none;">Choose Folder</button>
          <button id="file-picker-files-btn">Choose Files</button>
          <input type="file" id="file-picker-input" multiple accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.wma" style="display:none;" />
        </div>
        <p class="file-picker-drop-hint">or drag &amp; drop audio files anywhere on this panel</p>
        <div id="file-picker-status">
          <div id="file-picker-progress"></div>
          <ul id="file-picker-list"></ul>
        </div>
        <button id="file-picker-continue" style="display:none;">Continue</button>
      </div>
    </div>

    <div id="logo">
      <img src="{{ url_for('static', filename='bat/ListenHereBat.svg') }}" height="140" alt="Logo" />
    </div>
    <div id="wrapper">
      <nav>
          <a id="back">Back</a>
          <button id="mark">Mark</button>
          <button id="playLastMark">Play from last marker</button>
          <button id="playpause">Play/Pause</button>
          <span>
            <input type="checkbox" id="transitionType" checked />
            <label for="transitionType">Jump to marker</label>
          </span>
          <span>
            <input type="checkbox" id="showSpectrograms"/>
            <label for="showSpectrograms">Spectrograms</label>
          </span>
          <span>
            <input type="checkbox" id="normalize"/>
            <label for="normalize">Normalize audio</label>
          </span>
          <span>
            <input type="checkbox" id="visalign"/>
            <label for="visalign">Visualise alignments</label>
          </span>
          <span>
            <input type="checkbox" id="visrelalign"/>
            <label for="visrelalign">Show relative position</label>
          </span>
          <button id="manage-files-btn" style="display:none;">Manage files</button>
          <button id="download-json-btn" style="display:none;">Download JSON</button>
          <span id="close-listening-badge" style="display:none;">Close Listening</span>
          <div id="audios"></div>
      </nav>
      <div id="content-wrapper">
        <div id="content">
          <div id="waveforms"></div>
        </div>
        <div id="solidPanel">
          <div id="solidTab">
            <div id="solidLogin">
              Please <a id="solidLogin">Click here to log in!</a>
            </div>
          </div>
          <div id="maoExtracts">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
